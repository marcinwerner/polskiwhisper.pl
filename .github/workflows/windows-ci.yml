name: Windows CI

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'windows/**'
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  CONFIGURATION: 'Release'
  SOLUTION_PATH: 'windows/PolskiWhisperWin.sln'

jobs:
  build-and-test:
    name: Build and test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup MSBuild (z Visual Studio dla WinUI 3 MRT tasks)
        uses: microsoft/setup-msbuild@v2

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('windows/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: msbuild ${{ env.SOLUTION_PATH }} /t:Restore /p:Configuration=${{ env.CONFIGURATION }} /p:Platform=x64

      - name: Build
        run: msbuild ${{ env.SOLUTION_PATH }} /p:Configuration=${{ env.CONFIGURATION }} /p:Platform=x64 /v:normal

      - name: Run tests
        run: dotnet test windows/src/PolskiWhisperWin.Tests/PolskiWhisperWin.Tests.csproj -c ${{ env.CONFIGURATION }} --verbosity normal --collect:"XPlat Code Coverage"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/**/*.trx'

  publish-x64:
    name: Publish x64
    runs-on: windows-latest
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Publish x64
        run: |
          dotnet publish windows/src/PolskiWhisperWin/PolskiWhisperWin.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o publish/win-x64

      - name: Install WiX
        run: dotnet tool install --global wix

      - name: Build MSI installer
        shell: pwsh
        run: |
          $version = "0.1.0-ci-${env:GITHUB_RUN_NUMBER}"
          ./windows/scripts/build-installer.ps1 -Runtime win-x64 -Version $version

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PolskiWhisper-win-x64
          path: |
            windows/dist/*.msi
            windows/dist/*.zip

  release:
    name: Create GitHub Release
    runs-on: windows-latest
    needs: [build-and-test, publish-x64]
    if: startsWith(github.ref, 'refs/tags/win-v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore + publish + installer
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart("win-v")
          dotnet restore ${{ env.SOLUTION_PATH }}
          dotnet publish windows/src/PolskiWhisperWin/PolskiWhisperWin.csproj `
            -c Release -r win-x64 --self-contained true -o publish/win-x64
          dotnet tool install --global wix
          ./windows/scripts/build-installer.ps1 -Runtime win-x64 -Version $version

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows/dist/*.msi
            windows/dist/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
