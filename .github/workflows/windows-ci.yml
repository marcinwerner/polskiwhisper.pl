name: Windows CI

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-ci.yml'
      - 'global.json'
  pull_request:
    branches: [main]
    paths:
      - 'windows/**'
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  CONFIGURATION: 'Release'
  SOLUTION_PATH: 'windows/PolskiWhisperWin.sln'

jobs:
  build-and-test:
    name: Build and test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup MSBuild (z Visual Studio dla WinUI 3 MRT tasks)
        uses: microsoft/setup-msbuild@v2

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('windows/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: msbuild ${{ env.SOLUTION_PATH }} /t:Restore /p:Configuration=${{ env.CONFIGURATION }} /p:Platform=x64

      - name: Build
        run: msbuild ${{ env.SOLUTION_PATH }} /p:Configuration=${{ env.CONFIGURATION }} /p:Platform=x64 /v:normal

      - name: Run tests
        run: dotnet test windows/src/PolskiWhisperWin.Tests/PolskiWhisperWin.Tests.csproj -c ${{ env.CONFIGURATION }} --verbosity normal --collect:"XPlat Code Coverage"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/**/*.trx'

  # Publish x64 + Create GitHub Release jobs zostały wyłączone w v0.1.0
  # MSI build wymaga Visual Studio 2022 + Windows SDK lokalnie.
  # Marcin generuje MSI ręcznie przez windows/scripts/build-installer.ps1
  # i tworzy GitHub Release przez windows/scripts/release.ps1 lub gh CLI.
  #
  # Aktywacja w v0.2.0 - wymaga research jak uruchomić MRT/PRI tools na CI runner
  # bez pełnej Visual Studio installation (lub po prostu user windows-2025-vs2026 image
  # z preinstallowanym MSBuild + Windows SDK).
