name: Windows CI

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-ci.yml'
      - 'global.json'
  pull_request:
    branches: [main]
    paths:
      - 'windows/**'
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  CONFIGURATION: 'Release'
  SOLUTION_PATH: 'windows/PolskiWhisperWin.sln'

jobs:
  build-and-test:
    name: Build and test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup MSBuild (z Visual Studio dla WinUI 3 MRT tasks)
        uses: microsoft/setup-msbuild@v2

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('windows/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: msbuild ${{ env.SOLUTION_PATH }} /t:Restore /p:Configuration=${{ env.CONFIGURATION }} /p:Platform=x64

      - name: Build
        run: msbuild ${{ env.SOLUTION_PATH }} /p:Configuration=${{ env.CONFIGURATION }} /p:Platform=x64 /v:normal

      - name: Run tests
        run: dotnet test windows/src/PolskiWhisperWin.Tests/PolskiWhisperWin.Tests.csproj -c ${{ env.CONFIGURATION }} --verbosity normal

  publish-x64:
    name: Publish x64 (self-contained ZIP)
    runs-on: windows-latest
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # KLUCZOWY: setup-msbuild w Publish job - dostarcza Visual Studio MSBuild
      # z Microsoft.Build.Packaging.Pri.Tasks.dll (potrzebny dla MRT/PRI generation).
      # Bez tego Publish wywala się z MSB4062 mimo flag w csproj.
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild ${{ env.SOLUTION_PATH }} /t:Restore /p:Configuration=Release /p:Platform=x64

      - name: Publish self-contained x64
        shell: pwsh
        run: |
          msbuild windows\src\PolskiWhisperWin\PolskiWhisperWin.csproj `
            /t:Publish `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RuntimeIdentifier=win-x64 `
            /p:SelfContained=true `
            /p:WindowsAppSDKSelfContained=true `
            /p:PublishDir=publish\win-x64\ `
            /v:minimal

      - name: Pack ZIP for distribution
        shell: pwsh
        run: |
          $version = "0.1.0-build${env:GITHUB_RUN_NUMBER}-${env:GITHUB_SHA}".Substring(0, 32)
          $zipName = "PolskiWhisper-$version-win-x64.zip"
          $publishPath = "windows\src\PolskiWhisperWin\publish\win-x64"

          # Sanity check.
          if (-not (Test-Path "$publishPath\PolskiWhisper.exe")) {
            Write-Error "PolskiWhisper.exe nie został utworzony w $publishPath"
            Get-ChildItem -Path $publishPath -ErrorAction SilentlyContinue | Format-Table Name, Length
            exit 1
          }

          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          Compress-Archive -Path "$publishPath\*" -DestinationPath "dist\$zipName" -Force

          $size = (Get-Item "dist\$zipName").Length / 1MB
          Write-Host "Created: dist\$zipName ($([Math]::Round($size, 1)) MB)"

      - name: Upload artifact (Szymon - pobierz z 'Artifacts' na dole strony Actions)
        uses: actions/upload-artifact@v4
        with:
          name: PolskiWhisper-win-x64
          path: dist/*.zip
          retention-days: 30
          compression-level: 0  # ZIP juz skompresowany

  release-on-tag:
    name: Create GitHub Release (tag win-vX.Y.Z)
    runs-on: windows-latest
    needs: [build-and-test, publish-x64]
    if: startsWith(github.ref, 'refs/tags/win-v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: PolskiWhisper-win-x64
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
