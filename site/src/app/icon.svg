<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#221820"/>
      <stop offset="55%" stop-color="#100a10"/>
      <stop offset="100%" stop-color="#080406"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="62%" r="45%">
      <stop offset="0%" stop-color="#dc4150" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#dc4150" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#dc4150" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" ry="112" fill="url(#glow)"/>
  <g transform="translate(65, 256)">
    <!-- 11 bars centered horizontally, symmetric heights peaking in middle -->
    <!-- Bar width 22, gap 14, stride 36. y = -h/2 -->
    <rect x="0"   y="-40"  width="22" height="80"  rx="11" fill="#ffffff" opacity="0.78"/>
    <rect x="36"  y="-65"  width="22" height="130" rx="11" fill="#ffffff" opacity="0.85"/>
    <rect x="72"  y="-95"  width="22" height="190" rx="11" fill="#ffffff" opacity="0.92"/>
    <rect x="108" y="-120" width="22" height="240" rx="11" fill="#ffffff" opacity="0.96"/>
    <rect x="144" y="-140" width="22" height="280" rx="11" fill="#dc4150"/>
    <rect x="180" y="-160" width="22" height="320" rx="11" fill="#e64a5a"/>
    <rect x="216" y="-140" width="22" height="280" rx="11" fill="#dc4150"/>
    <rect x="252" y="-120" width="22" height="240" rx="11" fill="#ffffff" opacity="0.96"/>
    <rect x="288" y="-95"  width="22" height="190" rx="11" fill="#ffffff" opacity="0.92"/>
    <rect x="324" y="-65"  width="22" height="130" rx="11" fill="#ffffff" opacity="0.85"/>
    <rect x="360" y="-40"  width="22" height="80"  rx="11" fill="#ffffff" opacity="0.78"/>
  </g>
</svg>
